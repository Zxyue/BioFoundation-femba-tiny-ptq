tag: FEMBA_tiny_finetune

gpus: 1
num_nodes: 1
num_workers: 4
batch_size: 128

training: True
final_validate: True
final_test: True
finetune_pretrained: True

layerwise_lr_decay: 0.75
scheduler_type: cosine

pretrained_checkpoint_path:  null
pretrained_safetensors_path: null

callbacks:
  epoch_summary:
    _target_: util.epoch_summary.EpochSummary
  progress_bar:
    _target_: 'pytorch_lightning.callbacks.TQDMProgressBar'
    refresh_rate: 50
  early_stopping:
    _target_: 'pytorch_lightning.callbacks.EarlyStopping'
    monitor: 'val_loss'
    patience: 10
    mode: 'min'
    verbose: True

input_normalization:
  normalize: True
  quartile_normalization_lower_val: -20
  quartile_normalization_upper_val:  20

finetuning:
  freeze_layers: True

io:
  base_output_path: ${env:CHECKPOINT_DIR}/tb_logs
  checkpoint_dirpath: ${env:CHECKPOINT_DIR}/checkpoints
  version: 0

defaults:
  - override /data_module: finetune_data_module_FEMBA_tiny
  - override /model: FEMBA_tiny_finetune
  - override /scheduler: cosine
  - override /task: finetune_task
  - override /criterion: finetune_criterion

model:
 num_classes: 2
 classification_type: "bc"

trainer:
  accelerator: gpu
  num_nodes: ${num_nodes}
  devices: ${gpus}
  strategy: auto
  max_epochs: 30

model_checkpoint:
  save_last: True
  monitor: "val_loss"
  mode: "min"
  save_top_k: 1

optimizer:
  optim: 'AdamW'
  lr: 5.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.5

scheduler:
  trainer: ${trainer}
  min_lr: 2.5e-6 # minimum LR for the cosine scheduler
  warmup_lr_init: 2.5e-7 # initial LR for the warmup phase 
  warmup_epochs: 10
